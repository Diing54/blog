<div class="post-data"
     data-title="Current State of My Homelab: 17 Containers"
     data-content="Today, while doing my daily maintainance tasks for my homelab, I had to pause and reminisce how far I came running and managing my homelab. A year ago, this was just an idea and I was always reading about other people&amp;rsquo;s blog about their homelabs. Today, I run my own and it has become a very important part of my digital life.
My setup isn&amp;rsquo;t some massive server rack you would see on YouTube with some fancy RGB lighting. It&amp;rsquo;s a single Raspberry Pi 5 (8GB variant), sitting on my desk running debian linux. Right now, it&amp;rsquo;s spinning 17 containers and acting as the backbone for my digital life. It&amp;rsquo;s not perfect, definitely not enterprise-grade, but it is my safe playing ground for learning cloud-native infrastructure.
Here is a peek of what I&amp;rsquo;m running, what my current workflows actually looks like, and the problems I&amp;rsquo;ve dealt with lately.
The Stack I am heavily focused on privacy, knowledge management and archiving since I&amp;rsquo;m always actively learning.
Paperless-ngx: This is the heaviest thing I&amp;rsquo;m running. It OCRs and indexes all my documents, backed by Postgres and Redis. DevOps Wiki: These are my personal technical notes rendered by Quartz, an open-source static-site generator that converts my Markdown files into a website. I love taking notes because I can later come back to them when I need to remember something or simply update them. Wallabag: This is an app I use for saving long-form articles so I can read them later. It extracts all the contents from the web so it doesn&amp;rsquo;t matter if the original source is deleted, I will still have my own copy locally. Crumbs: This is a lightweight app I use for short note taking. It comes with a nice web interface for viewing all your short notes. Linkding: A bookmark manager I use for saving links. DevLog: This is a custom application I built from scratch. It&amp;rsquo;s an activity tracker where I log my daily activities. Vaultwarden: A password manager. Since it&amp;rsquo;s self-hosted, it has forced me to take my infrastructure seriously. You don&amp;rsquo;t wanna have someone break into your homelab and access this. I have proper security decisions around this app together with backup solutions which I will talk about in another blog. Blog: My blog page cloudiing.com PairDrop: A tool I use frequently to share files across my devices. Homepage: This is a nice dashboard where I view the entire state of my Homelab and everything running in it. I can access it from anywhere and be able to monitor my homelab remotely. All applications and services are dockerized and sit behind a Cloudflare Tunnel. No forwarded ports from my router and the hardware doesn&amp;rsquo;t listen on the public web. Cloudlfare does all the heavy lifting i.e handles the SSL and routes traffic straight into the Docker networks.
Deployment Pipeline If you look at my homelab repo, I have Renovate Bot that scans all my docker-compose.yaml files. Whenever a new image tag drops for any app or service running, Renovate automatically creates a Pull Request. I then manually review the changes and merge them into main. To actually deploy the update, I have to ssh into the hardware and navigate to my homelab directory, and run git pull to bring down the updated code to the raspberry pi. Then I run docker compose down on the affected apps and docker compose up -d to spin the containers backup with the new images.
My infrastructure is defined as code in a repo. The repo shows what is currently running on my desk, that is one step towards GitOps.
Challenges Every homelabber must go through some problems along the way, no one escapes that. Here are some of the issues I faced recently:
Named Volume vs Bind Mount When I first deployed the Crumbs container, I mapped the storage in my Docker Compose file using crumbs_data:/data. I expected a data folder to appear in the app&amp;rsquo;s directory so I could see it and back it up. It didn&amp;rsquo;t. I spent so much time looking for my database files and I even had to go through Crumb&amp;rsquo;s official documentation before realizing the difference between a Docker Named Volume and a Bind Mount. Because I didn&amp;rsquo;t use a relative path (./crumbs_data:data), Docker took control of the storage and buried it deep inside the root filesystem at /var/lib/docker/volumes. My obejctive was to not commit this data on GitHub and I noticed it was even untracked by git when this storage is managed by Docker. I just left it that way.
CI/CD I wrote a GitHub Actions workflow to build the Docker image for my DevOps wiki. It was painfully slow. I eventually realized that because the Pi is ARM64, GitHub’s x86 runners were using QEMU to emulate an ARM processor during the npm build step. I had to rewrite the Dockerfile to force BuildKit to use the runner&amp;rsquo;s native architecture (&amp;ndash;platform=$BUILDPLATFORM), and only cross-compile the final Nginx layer. Build time was cut by 50% from 4 minutes to 2 minutes.
What&amp;rsquo;s Next Right now I have just gotten into learning Kubernetes, specifically k3s. My next goal is to migrate from this Docker Compose set up to Kubernetes. For now my homelab just works fine.
References https://github.com/Diing54/homelab "

<div class="post-data"
     data-title="Thinking About Podman (My Docker Daemon Crashed)"
     data-content="A couple of days ago, my homelab infrastructure went down. Running docker ps and seeing nothing. This happened on my Raspberry Pi that was running 11 containers that crashed with exit code 139. At this exact moment, I assumed a reboot or an Out-of-Memory (OOM) might have caused the issue. I checked the uptime of the hardware and there were no reboots at the time the containers crashed. Ram usage was normal too.
The Problem I then checked the journalctl logs of the docker service and found the issue:
May 17 15:35:29 prod dockerd[1087]: SIGSEGV: segmentation violation May 17 15:35:29 prod dockerd[1087]: PC=0xaaaab3b59970 m=8 sigcode=1 addr=0x3ffc3d33a0 May 17 15:35:29 prod dockerd[1087]: runtime.adjustpointers(...) May 17 15:35:29 prod dockerd[1087]: runtime.copystack(...) Docker is written in Go and uses a background process, dockerd, to manage containers. The above logs show that the linux kernel threw a Segmentation Fault(SIGSEGV) which happens when a process tries to read or write to a memory address that has not been allocated to it and most of the times, it&amp;rsquo;s a bug in Go&amp;rsquo;s runtime. The Segmentation Fault killed the Docker Daemon.
Docker operates on a client-server architecture and the containers are dependent on that daemon. When dockerd crashes, it drags down every single container running.
Solution I researched about this issue and I found that you can mitigate this by adding &amp;quot;live-restore&amp;quot;: true to daemon.json file, which tells Docker to leave containers running if the daemon restarts.
Podman Switch ? Dealing with this crash made me think about Podman. For now, atleast I have surface-level knowledge about it. It is daemonless so there is no single point of failure like in Docker. Podman talks to the Linux kernel directly to spin up container processes. Podman also runs containers rootless by default which is a great security feature.
This daemonless setup is appealing to me, but I need to learn more about it.
Conclusion My homelab is back online under Docker and the incident was a reminder of how single points of failure behave in production. Docker is a great tool but I will likely start experimenting my self-hosted applications with Podman and see the results.
References https://oneuptime.com/blog/post/2026-02-08-how-to-fix-docker-container-immediately-exiting-with-code-139/view "

<div class="post-data"
     data-title="Scaling My Homelab"
     data-content="In my last post, I wrote how I containerized this blog application. Previously, I used GitHub pages to serve it but now it exists as an artifact and needs a container runtime for it to run. I decided to deploy it on my Raspberry Pi. To expose it to the internet, I registered a domain via Cloudflare and configured a Cloudflare Tunnel which routes traffic down to my infrastructure securely without exposing any ports.
Now, I have deployed 2 self-hosted applications directly to the Pi. The first one is Linkding, a bookmark manager to keep track of resources I come across online, and Homepage, a customizable dashboard plugged to the Docker daemon for me to view the live metrics of apps running in my homelab. These apps are also exposed to the internet via the same Cloudflare tunnel and registered using subdomains from cloudiing.com. I can now access what is running in my homelab remotely with proper authentication required. Below is my current homepage;
The goal for this homelab is for it to be GitOps purposed.
GitOps is a set of practices for managing infrastructure and application configurations using Git repositories as the single source of truth. &amp;mdash; Red Hat.
I am not there yet fully GitOps but I have started implementing it. I discovered Renovate, an automated dependency update tool that scans code repos and automatically creates PRs for outdated images for apps running in my homelab. Instead of manually looking for software updates, the bot does this automatically and opens a Pull Request in my homelab repo. I then read the release notes and I can choose to merge and pull down the new code to the Pi.
I have found self-hosting to be actually a hobby. It&amp;rsquo;s fun running and managing apps in your own hardware sitting on your desk. I hope to push this homelab further to the point where I will be simulating enterprise-grade infrastructure using Kubernetes and learn more from it.
References "

<div class="post-data"
     data-title="Dockerized My Blog Setup"
     data-content="After finishing a comprehensive Docker course, I felt comfortable with container primitives and the security practices around it.
But tutorials only get you so far. To internalize these concepts and deepen my understanding, I decided to containerize my personal blog.
My blog is already built with Hugo and uses the Papermod theme. Before, I just relied on a standard GitHub Action that compiled the static site and deployed it directly to GitHub Pages and it worked perfectly fine.
I wanted to transition from this static deployment to a fully containerized artifact. By packaging the blog into a Docker image and storing it to a Registry, I achieve a few things;
Environment Agnosticism: The container runs exactly the same on my laptop or any other machine whether it&amp;rsquo;s my homelab server or in a cloud VPS. Immutability: Every version of my blog application is tagged and stored. Practice: I wanted to experiment with this application container fundamentals, starting from the Dockerfile multi-stage builds, security practices (non-root containers) to CI/CD automation. How I Implemented this 1. Dockerfile I created a Dockerfile at the root directory of my blog repository. To keep the final image lightweight and secure, I used a multi-stage build;
FROM hugomods/hugo:debian-exts AS builder ARG HUGO_BASEURL=&amp;#34;http://localhost:8080/&amp;#34; WORKDIR /app COPY . . RUN hugo --minify -b ${HUGO_BASEURL} FROM nginxinc/nginx-unprivileged:alpine COPY default.conf /etc/nginx/conf.d/default.conf COPY --from=builder /app/public /usr/share/nginx/html EXPOSE 8080 CMD [&amp;#34;nginx&amp;#34;, &amp;#34;-g&amp;#34;, &amp;#34;daemon off;&amp;#34;] Stage 1: Uses the official hugomods/hugo:debian-exts image to compile the Markdown files into HTML by runnig hugo --minify. Stage 2: Uses an unprivileged Nginx image to serve the HTML content. This image drops root permissions and runs the container safely. 2. Nginx Configuration Hugo generates &amp;ldquo;pretty URLs&amp;rdquo; (where /posts/my-post/ maps to an index.html file) and custom 404.html pages. Out of the box, Nginx doesn&amp;rsquo;t know how to route these properly. I wrote a custom default.conf to handle the routing gracefully:
server { listen 8080; server_name localhost; root /usr/share/nginx/html; index index.html index.htm; # Handle Hugo&amp;#39;s pretty URLs location / { try_files $uri $uri/ =404; } error_page 404 /404.html; location = /404.html { internal; } } 3. CI/CD Pipeline I replaced my old GitHub Pages workflow with a Docker release pipeline. On every merge to main, or whenever I push a semantic version tag like v1.0.0, a GitHub Action spins up. It checks code, logs into GHCR, extracts metadata for tagging, builds and pushes the image.
I also added a .dockerignore file, basically a .gitignore for the Docker daemon, which prevents bloated local directories like .git from slowing down the build context.
When I was testing the image locally, I ran into a problem. Nginx was serving raw the HTML files without any styling and I found the issue. I never knew the Papermod theme was being tracked as a submodule. By default, the directories where submodules are attached are always empty when the repo is cloned. All these months I had an empty folder locally for the Papermod theme. My blog application worked fine since the GitHub Actions runner fetched the theme and deployed it to GitHub Pages;
steps: - name: Checkout uses: actions/checkout@v4 with: submodules: recursive A git clone command leaves submodule directories completely empty to save bandwidth. To get them instantly, you run git submodule update --init --recursive.
References https://github.com/Diing54/blog "

"

<div class="post-data"
     data-title="Stop Running Docker Containers as Root"
     data-content="You&amp;rsquo;ve probably been running containers the wrong way like me a while ago but still don&amp;rsquo;t know it yet. Processes inside a container run as root user by default. Here is why this is a security risk and how to fix it.
Shared Kernel Unlike Virtual Machines, Docker containers share your host machine&amp;rsquo;s kernel. The root user inside your container is basically the same root user on your actual computer.
If an attacker manages to exploit a vulnerability in your containerized app and escapes the container, they land on your host system with root permissions.
I have containerized a program called yt-dlp which is a command line tool that is used to download YouTube videos. Initially, I ran the container as root. This can be seen from the Dockerfile I used to build its image;
FROM ubuntu:24.04 WORKDIR /mydir RUN apt-get update &amp;amp;&amp;amp; apt-get install -y curl python3 ffmpeg RUN curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp RUN chmod a&#43;x /usr/local/bin/yt-dlp ENTRYPOINT [&amp;#34;/usr/local/bin/yt-dlp&amp;#34;] If someone injects a bad code in one of yt-dlp packages, the blast radius includes my machine. A malicious process can modify files in my computer especially if there are bind mounts.
The Fix Instead of letting our container run as root by default, we need to bake an uprevileged user directly into the image. Here is the new Dockerfile;
FROM ubuntu:24.04 WORKDIR /mydir RUN apt-get update &amp;amp;&amp;amp; apt-get install -y curl python3 ffmpeg RUN curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp RUN chmod a&#43;x /usr/local/bin/yt-dlp # 1. Create a standard, restricted user RUN useradd -m appuser # 2. Switch to the new user USER appuser # 3. Execute the app ENTRYPOINT [&amp;#34;/usr/local/bin/yt-dlp&amp;#34;] After the line USER appuser, all root privileges are dropped. Any command that follows, including ENTRYPOINT that actually runs the application, will be executed by the restricted appuser. References https://medium.com/@tanmayrane209/why-you-should-never-run-containers-as-root-07d1fa1127d5 "
     data-summary="You&rsquo;ve probably been running containers the wrong way like me a while ago but still don&rsquo;t know it yet. Processes inside a container run as root user by default. Here is why this is a security risk and how to fix it.
Shared Kernel Unlike Virtual Machines, Docker containers share your host machine&rsquo;s kernel. The root user inside your container is basically the same root user on your actual computer.
"
     data-permalink="http://localhost:1313/posts/stop-running-docker-containers-as-root/"
     data-date="April 14, 2026">
</div>

<div class="post-data"
     data-title="AI in Gaming Isn&#39;t Slop"
     data-content="2 days ago at NVIDIA GTC, NVIDIA introduced the next evolution of its upscaling and frame generation technology, DLSS 5. This faced immediate reaction and backlash from the gaming community. The community was divided. We even went at it at the Whatsapp groupchat with my friends. Critics labelled it as &amp;ldquo;AI Slop&amp;rdquo;, the rendering results showcased by NVIDIA looked &amp;ldquo;horrible&amp;rdquo;.
From what I noted, this is just a deeper debate on Engineering vs Artistry
&amp;ldquo;Developers will get lazy and will ship poorly optimized games hoping for DLSS to upscale it&amp;rdquo; - Yes this is a real concern but historically new tech proved to remove constraints. What the devs will decide to to with this freedom is the real variable. Combining their expertise with DLSS will unlock new heights. Cars didn&amp;rsquo;t make people lazy in walking but enabled faster mobility.
&amp;ldquo;AI will eliminate the Artist&amp;rsquo;s intent&amp;rdquo; - DLSS will become another tool in the hands of Artists, this will make them enhance their creativity. Jensen even mentions that developers and artists will retain full control over how this AI technology is implemented.
AI will not remove creativity, it will just be used as a leverage and it will speed up work
I found this post on X by a game developer and this is what he had to say about DLSS 5, here
This is a shift in the industry from traditional 3D graphics to combining it with neural rendering. AI reconstruction of frames will be easier and more accurate in future and this will be very efficient than brute-forcing raw frames. So how the frames are generated will not matter, what matters here is how the users will perceive the final quality. The demos from NVIDIA looked off but people are forgetting that this tech is still at infancy. This will be the future of Gaming.
References https://www.youtube.com/live/jw_o0xr8MWU?si=tTgv8rSlWpUD9ao- https://prosettings.net/blog/upscaling-technologies-explained/ "

<div class="post-data"
     data-title="Fixing My Dns Server That Was Crashing on Boot"
     data-content="I recently ran into an issue while trying to ssh into my Raspberry Pi which is a dedicated DNS server for my homelab. The dnsmasq server is configured to listen to the Pi&amp;rsquo;s IP for incoming DNS requests. If I restarted the service manually systemctl restart dnsmasq, it worked fine. But everytime I rebooted the Pi, the service failed to start. The Pi&amp;rsquo;s IP is mapped into the name prod.homelab and with the DNS server failing to start, the command ssh astro@prod.homelab could not work since the client machine could not resolve the name prod.homelab. I had to ssh using the IP Address.
The Problem Checking the status with systemctl status dnsmasq showed this error;
dnsmasq: failed to create listening socket for 192.168.100.56: Cannot assign requested address FAILED to start up systemd[1]: dnsmasq.service: Failed with result &amp;#39;exit-code&amp;#39;. This was when I noticed the issue was about a race condition between the networking system and the dnsmasq service.
My config for the dnsmasq service used listen-address=192.168.100.56 and when the Pi boots, dnsmasq service starts immediately and tries to bind the IP address it has been instructed to. By this time, my Pi hasn&amp;rsquo;t yet been assigned an IP by the router (I configured Router-based static IP assignment) and the dnsmasq service crashes. The IP assignment was slower than the dnsmasq service.
The Fix Instead of binding to a specific IP address which I used before (listen-address=192.168.100.56), the solution was to bind the interface and use the bind-dynamic directive. This tells the dnsmasq service to start up successfully even if the network isn&amp;rsquo;t yet ready, and just wait for the interface to come online.
# OLD (Caused the crash) # listen-address=127.0.0.1,192.168.100.56 # NEW (The Fix) # Listen on local machine and the WiFi adapter interface=lo interface=wlan0 bind-dynamic The service now starts successfully after a quick reboot.
References "

<div class="post-data"
     data-title="Containerization"
     data-content="It has been a few days so far learning about containers and I&amp;rsquo;m fascinated by the advances they bring in the tech industry. Containers revolutionalized the development, testing and deployment of applications.
Before containers, teams would develop applications locally on their machines and ship the application to the operations team. Developers needed to specify the dependancies together with their versions and environment configurations for this application to run successfully on other machines e.g the production servers. This would sometimes be a lot of work writing all the requirements needed for a specific application to run and on the other end, the operations team would make mistakes in configuring the environment and the app fails to run. This would lead to conflicts between the two teams with the developer saying &amp;ldquo;It was working on my end&amp;rdquo;. With containers, teams utilize an image which is a portable package which has all the requirements required to run an application and it is spun up with a container.
What is a Container In my own technical terms, a container is just a linux process with a set of kernel features applied to it. These kernel features are restrictions of this process such as what it can see, what it can touch and what system resources it can use. These restrictions are enforced by;
Namespaces - What this process can see cgroups - Managing or limiting the resource usage of this process Filesystem Isolation - Its own filesystem which its child processes will reference to If we strip off these restrictions, we remain with just a chroot - a shell command that changes the apparent root directory of the current running process and its children.
Docker just automates the development of a container and adds other features such images, portable packaging and a friendly interface for manipulating these containers.
I came through this post on X and its more accurate in some senses
Docker containers therefore bring a standardized portable package/image that includes everything needed to run an application including the application code.
References Read more abouth containers and docker from my Kasten (https://diing54.github.io/devops/docs/containerization-fundamentals/) "

<div class="post-data"
     data-title="Https"
     data-content="I&amp;rsquo;ve always assumed HTTPS as &amp;ldquo;encryption&amp;rdquo; or &amp;ldquo;securing&amp;rdquo; data in a network like many of devopers out there but that&amp;rsquo;s just half of the story.
HTTPS is actually two things combined:
Encryption - Securing data so that other people can&amp;rsquo;t read it. Authentication - Proving that the intended server is really who it claims to be. This is the major part of HTTPS according to my experience when I just set up HTTPS in my homelab. Here is a simple high-level explanation on how HTTPS works.
Lets say I want to login to my facebook page on my browser, I will need to visit https://www.facebook.com/. The server that wants to serve the login page will need to prove that it is the actual facebook server and not someone pretending. The only way to prove this is by using a Certificate. Certificates are are signed and issued by Certificate Authorities that are trusted by most browsers by default. For a server to prove its identity, it shares back its Certificate back to the browser. The browser checks if this Certificate was signed by a trusted Certificate Authority,if yes, trust is earned and a secure tunnel to the server is established. I can now type in my email and password for my facebook page and this data will be encrypted and sent to the facebook servers securely.
References https://diing54.github.io/devops/docs/httphttpsssltls-and-ca/ "

<div class="post-data"
     data-title="Under the Hood of a Gcc Compiler"
     data-content="Today I learnt something worth publishing here. As developers we write code day by day and it is executed by our machines. But how does our computers understand this code and execute it ?
I am going to walk through the four core changes of a GCC compiler to transform a simple C program into a state that a machine can understand and execute.
I created a simple file main.c below:
#include &amp;lt;stdio.h&amp;gt; int main() { int a = 10; int b = 5; int result = a &#43; b; printf(&amp;#34;The result is: %d\n&amp;#34;, result); return 0; } Step 1: Invoking the Preprocessor This is the first stage. The preprocessor finds this line, #include &amp;lt;stdio.h&amp;gt;, in order to extract the stdio.h header file and paste its entire contents into our source code main.c
We run the command gcc -E main.c -o main.i The -E flag tells the GCC to stop after preprocessing -o main.i specifies the output file name. The .i extension is the standard for preprocessed C files Step 2: Compile to Assembly Code We take the preprocessed file and compile it to assembly language, a low-level, but still human-readable.
We run the command gcc -S main.i -o main.s The -S flag tells the compiler/GCC to stop after compiling to assembly The output is main.s with assembly code inside Step 3: Assemble to Object Code The assembler&amp;rsquo;s job is to convert the human-readable assembly code into pure machine code (binary)
We run the command gcc -c main.s -o main.o The -c flag tells the compiler to stop after the assembly stage The output is the object file main.o which is not yet executable Step 4: Link to Create an Executable File Our object file main.o contains the machine code for our main function but it doesn&amp;rsquo;t contain the code for the printf function. The linker&amp;rsquo;s job is to find the printf code in the C standard library and combine it with our object file to create a runnable program
We run the command gcc main.o -o my_program The final executable file my_program is created In the terminal, we can now run our program
./my_program
The output is:
The result is: 15

<script>

window.PaperModSearchOverride = true;


if (typeof window.initPaperModSearch === 'function') {
    window.initPaperModSearch = function() {};
}

document.addEventListener('DOMContentLoaded', function() {
    console.log('Custom search initialized - PaperMod search disabled');

    const searchInput = document.getElementById('search-query');
    const defaultState = document.getElementById('default-state');
    const loadingState = document.getElementById('loading-state');
    const resultsContainer = document.getElementById('results-container');
    const noResultsState = document.getElementById('no-results-state');
    const noResultsQuery = document.getElementById('no-results-query');

    
    const postElements = document.querySelectorAll('.post-data');
    const searchData = Array.from(postElements).map(el => ({
        title: el.getAttribute('data-title') || '',
        content: el.getAttribute('data-content') || '',
        summary: el.getAttribute('data-summary') || '',
        permalink: el.getAttribute('data-permalink') || '',
        date: el.getAttribute('data-date') || ''
    }));

    console.log('Search data loaded:', searchData.length, 'posts');

    function showState(state) {
        
        defaultState.style.display = 'none';
        loadingState.style.display = 'none';
        resultsContainer.style.display = 'none';
        noResultsState.style.display = 'none';

        
        switch(state) {
            case 'default': 
                defaultState.style.display = 'block'; 
                break;
            case 'loading': 
                loadingState.style.display = 'block'; 
                break;
            case 'results': 
                resultsContainer.style.display = 'block'; 
                break;
            case 'no-results': 
                noResultsState.style.display = 'block'; 
                break;
        }
    }

    function findTextContext(text, query, maxLines = 3) {
        const lowerText = text.toLowerCase();
        const lowerQuery = query.toLowerCase();
        const index = lowerText.indexOf(lowerQuery);
        
        if (index === -1) return null;

        
        let lineStart = text.lastIndexOf('\n\n', index);
        if (lineStart === -1) lineStart = Math.max(0, index - 100);
        
        
        let lineEnd = text.indexOf('\n\n', index);
        if (lineEnd === -1) lineEnd = Math.min(text.length, index + 200);
        
        
        let context = text.substring(lineStart, lineEnd).trim();
        
        
        const lines = context.split('\n');
        let limitedContext = '';
        let linesTaken = 0;
        
        for (let line of lines) {
            if (linesTaken >= maxLines) break;
            if (line.trim().length > 0) {
                limitedContext += (limitedContext ? '\n' : '') + line.trim();
                linesTaken++;
            }
        }
        
        
        if (lineStart > 0) limitedContext = '...' + limitedContext;
        if (lineEnd < text.length) limitedContext = limitedContext + '...';

        
        limitedContext = limitedContext.replace(
            new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), 
            match => `<mark>${match}</mark>`
        );

        return limitedContext;
    }

    function performSearch(query) {
        if (!query.trim()) {
            showState('default');
            return;
        }

        showState('loading');

        const results = [];
        const lowerQuery = query.toLowerCase();

        
        searchData.forEach(post => {
            const titleMatch = post.title.toLowerCase().includes(lowerQuery);
            const contentMatch = post.content.toLowerCase().includes(lowerQuery);
            const summaryMatch = post.summary.toLowerCase().includes(lowerQuery);
            
            if (titleMatch || contentMatch || summaryMatch) {
                let context = '';
                
                if (titleMatch) {
                    
                    const highlightedTitle = post.title.replace(
                        new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), 
                        match => `<mark>${match}</mark>`
                    );
                    context = `<strong>Title contains "${query}"</strong>`;
                } else if (contentMatch) {
                    
                    const contentContext = findTextContext(post.content, query, 3);
                    if (contentContext) {
                        context = contentContext;
                    } else {
                        
                        const beginning = post.content.substring(0, 150);
                        context = beginning.replace(
                            new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), 
                            match => `<mark>${match}</mark>`
                        ) + '...';
                    }
                } else if (summaryMatch) {
                    
                    const summaryContext = findTextContext(post.summary, query, 2);
                    if (summaryContext) {
                        context = summaryContext;
                    } else {
                        
                        context = post.summary.replace(
                            new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), 
                            match => `<mark>${match}</mark>`
                        );
                    }
                }

                results.push({
                    ...post,
                    context: context,
                    isTitleMatch: titleMatch
                });
            }
        });

        console.log('Found results:', results.length);

        if (results.length === 0) {
            noResultsQuery.textContent = `Searched ${searchData.length} posts - 0 results for "${query}"`;
            showState('no-results');
        } else {
            let html = '';
            results.forEach(result => {
                
                const displayTitle = result.isTitleMatch ? 
                    result.title.replace(
                        new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), 
                        match => `<mark>${match}</mark>`
                    ) : 
                    result.title;
                
                html += `
                    <div class="search-result" onclick="window.location.href='${result.permalink}'">
                        <div class="result-title">${displayTitle}</div>
                        <div class="result-content">${result.context}</div>
                        <div class="result-footer">
                            <span>${result.date}</span>
                            <span> • Click to read full article</span>
                        </div>
                    </div>
                `;
            });
            resultsContainer.innerHTML = html;
            showState('results');
        }
    }

    
    let searchTimeout;
    searchInput.addEventListener('input', function(e) {
        const query = e.target.value.trim();
        
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            performSearch(query);
        }, 300);
    });

    
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
    });

    searchInput.addEventListener('keyup', function(e) {
        e.stopPropagation();
    });

    searchInput.focus();
});


window.addEventListener('load', function() {
    const paperModSearchScript = document.querySelector('script[src*="search"]');
    if (paperModSearchScript) {
        paperModSearchScript.remove();
    }
});
</script>

<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    window.onscroll = function () {
        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
<script>
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const html = document.querySelector("html");
        if (html.dataset.theme === "dark") {
            html.dataset.theme = 'light';
            localStorage.setItem("pref-theme", 'light');
        } else {
            html.dataset.theme = 'dark';
            localStorage.setItem("pref-theme", 'dark');
        }
    })
